 name: HLS Stream with Logo

on:
  workflow_dispatch:  # Manuel tetikleme
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir yeniden başlat

jobs:
  stream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      run: |
        pip install requests
    
    - name: Create directories
      run: |
        mkdir -p ~/zemtv/hls
    
    - name: Run stream generator
      run: |
        python stream_generator.py
      env:
        PORT: 8080
        INPUT_URL: ${{ secrets.INPUT_URL || 'https://cdn.codenet.lol/streamgo/stremgo123/4866.m3u8' }}
